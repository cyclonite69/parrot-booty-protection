# Unbound DNS Resolver Configuration - Hardened for Parrot OS with DNS over TLS
# Canonical template: configs/unbound.conf (consumed by scripts/apply_dns_hardening.sh)
# Deployed path: /etc/unbound/unbound.conf
#
# Intentionally self-contained: do NOT include /etc/unbound/unbound.conf.d/*.conf.
# Debian/Parrot package drop-ins (root-auto-trust-anchor-file.conf, remote-control.conf)
# would otherwise duplicate the trust-anchor declaration and override remote-control policy.
# The apply script disables those conflicting drop-ins on deployment.

server:
    # Network interface and port configuration
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Access control - localhost only for security
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    # Privacy hardening - query minimization
    qname-minimisation: yes
    qname-minimisation-strict: yes

    # Disable logging for privacy
    verbosity: 1
    log-queries: no
    log-replies: no
    log-servfail: no

    # DNSSEC validation — single trust-anchor declaration (do not also load package drop-in)
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes
    val-permissive-mode: no
    val-log-level: 1

    # DNS over TLS certificate bundle for upstream authentication
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    # Performance and security settings
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2

    # Cache settings
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes

    # Rate limiting to prevent abuse
    ratelimit: 1000
    ratelimit-slabs: 4
    ratelimit-size: 4m

    # Security hardening
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes

    # Prevent DNS rebinding attacks
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # Memory usage limits
    rrset-cache-size: 100m
    msg-cache-size: 50m
    key-cache-size: 100m
    neg-cache-size: 10m

# Fail-closed encrypted forwarding: TLS upstream only, no recursive fallback.
# forward-first: no means SERVFAIL from forwarders does NOT fall back to recursion.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-first: no
    # Cloudflare DNS over TLS
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    # Quad9 DNS over TLS (threat-filtered; coexists as alternate encrypted upstream)
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net

# Remote control: local Unix socket only (matches validated host admin path).
# Not network-exposed: no control-port / IP listen addresses.
remote-control:
    control-enable: yes
    control-interface: /run/unbound.ctl
